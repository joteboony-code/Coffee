services:
  postgres:
    image: postgres:16-alpine
    container_name: coff-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coff_pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - coff_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coff_pos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  coff_postgres:
